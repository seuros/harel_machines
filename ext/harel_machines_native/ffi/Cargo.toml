[package]
name = "harel_machines_native"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "MIT"
description = "Ruby bindings for the harel-machines statechart hierarchy"
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
harel-machines = { workspace = true, features = ["std"] }
magnus = { version = ">= 0.9.3", default-features = false, features = ["io"] }
