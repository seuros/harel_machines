[package]
name = "harel_machines_native"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ruby bindings for the harel-machines statechart hierarchy"
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
harel-machines.workspace = true
magnus.workspace = true
# Nothing here calls rb-sys directly: this is the compiled fallback that
# implements the stable API for a Ruby rb-sys ships no pre-generated bindings
# for, such as a preview. magnus asks for "stable-api" without it, and its
# default-features = false drops the default that would have supplied it, so
# dropping this line breaks the build on every Ruby newer than rb-sys.
rb-sys.workspace = true
matryona-machines = { workspace = true, features = ["ruby"] }

[lints]
workspace = true
